<!doctype html>
<html lang="en" data-theme="light" class="light">
  <head>
    <meta charset="UTF-8" />
    <!-- CRITICAL: resolve theme before first paint so there is no flash of the wrong theme -->
    <script>
      (function () {
        var KEY = 'theme', root = document.documentElement;
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function read() { var s = localStorage.getItem(KEY); return (s === 'light' || s === 'dark' || s === 'system') ? s : 'light'; }
        function apply(mode) {
          var resolved = mode === 'system' ? (mq.matches ? 'dark' : 'light') : mode;
          root.setAttribute('data-theme', resolved);
          root.setAttribute('data-theme-mode', mode);
          root.classList.remove('light', 'dark');
          root.classList.add(resolved);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', resolved === 'dark' ? '#141413' : '#f7f3ee');
        }
        try { apply(read()); } catch (e) {}
        var onChange = function () { if (read() === 'system') apply('system'); };
        if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
      })();
    </script>
    <!-- CRITICAL CSS: first style in <head> so the correct background is painted before any JS/CSS loads -->
    <style>
      html, body, #root { background-color: #f7f3ee; }
      html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root { background-color: #141413; color-scheme: dark; }
      html[data-theme="light"] { color-scheme: light; }
      html[data-theme="dark"] { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        min-height: 100dvh;
      }
      #root { min-height: 100vh; min-height: 100dvh; }
      ::view-transition-old(root), ::view-transition-new(root) {
        animation-duration: 180ms;
        animation-timing-function: ease-out;
      }
      ::view-transition-group(*) { animation-duration: 180ms; }
    </style>
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <title>Veritas — Know the Truth. Live the Truth.</title>
    <meta name="description" content="Veritas — The most beautiful Bible app. Read, search, highlight and study Scripture with daily devotionals, reading plans, and gamified growth." />
    <meta name="theme-color" content="#f7f3ee" />
    <meta name="color-scheme" content="dark light" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
