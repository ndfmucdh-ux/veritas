<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- CRITICAL CSS: first style in <head> so the correct background is painted before any JS/CSS loads -->
    <style>
      :root { color-scheme: dark; }
      html, body {
        background-color: #1c2231;
        margin: 0;
        padding: 0;
        min-height: 100%;
        min-height: 100dvh;
      }
      #root { background-color: #1c2231; min-height: 100vh; min-height: 100dvh; }
      @media (prefers-color-scheme: dark) { html, body, #root { background-color: #1c2231; } }
      html.dark, html.dark body, html.dark #root { background-color: #1c2231; }
      ::view-transition-old(root), ::view-transition-new(root) {
        animation-duration: 180ms;
        animation-timing-function: ease-out;
      }
      ::view-transition-group(*) { animation-duration: 180ms; }
      ::view-transition { background-color: #1c2231; }
    </style>
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <title>Veritas — Know the Truth. Live the Truth.</title>
    <meta name="description" content="Veritas — The most beautiful Bible app. Read, search, highlight and study Scripture with daily devotionals, reading plans, and gamified growth." />
    <meta name="theme-color" content="#1c2231" />
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
