<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CRITICAL CSS: first style in <head> so the correct background is painted before any JS/CSS loads -->
    <style>
      html, body { background-color: #FAF6F0; margin: 0; padding: 0; min-height: 100%; min-height: 100dvh; }
      #root { background-color: #FAF6F0; min-height: 100vh; min-height: 100dvh; }
      html.dark, html.dark body, html.dark #root { background-color: #1C1917; }
      ::view-transition-old(root), ::view-transition-new(root) {
        animation-duration: 180ms;
        animation-timing-function: ease-out;
      }
      ::view-transition-group(*) { animation-duration: 180ms; }
      ::view-transition { background-color: #FAF6F0; }
      html.dark ::view-transition { background-color: #1C1917; }
    </style>
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <title>Veritas — Know the Truth. Live the Truth.</title>
    <meta name="description" content="Veritas — The most beautiful Bible app. Read, search, highlight and study Scripture with daily devotionals, reading plans, and gamified growth." />
    <meta name="theme-color" content="#FAF6F0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Early theme script: runs before first paint so there is never a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("veritas_theme") || "system";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          r.classList.toggle("dark", dark);
          r.style.colorScheme = dark ? "dark" : "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#1C1917" : "#FAF6F0");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
